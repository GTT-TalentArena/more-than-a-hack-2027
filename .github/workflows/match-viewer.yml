name: Local match viewer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MTAH_DATA_DIR: /tmp/gtt-no-match-data
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install shared Python dependencies
        run: python -m pip install -r docker/requirements.lock
      - name: Install optional browser-test dependencies
        working-directory: tools/match_viewer
        run: npm ci
      # Playwright's own Chromium (pinned by the lockfile), cached between runs. No --with-deps:
      # the ubuntu-24.04 image already has the libraries headless Chromium needs, and the extra
      # system packages it would add (CJK fonts, xvfb) are only for headed browsers. Installing
      # them through apt made this job depend on the Ubuntu mirror's speed and hit the timeout.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tools/match_viewer/package-lock.json') }}
      - name: Install Chromium for synthetic UI checks
        working-directory: tools/match_viewer
        timeout-minutes: 4
        run: npx playwright install chromium
      - name: Check elapsed-time playback
        run: node --test tests/match_viewer_playback.test.mjs
      - name: Check synthetic UI and external requests
        run: node tests/match_viewer_browser.cjs
