name: Validate log front matter

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: validate-log-frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Validate front matter
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const hasLog = pr.labels.some(l => l.name === 'log');

            if (!hasLog) {
              core.info('The PR has no log label: the front matter is not validated.');
              return;
            }

            const TYPES = ['study', 'code', 'experiment', 'iteration', 'data', 'decision'];
            const OUTCOMES = ['success', 'failure', 'mixed', 'open'];
            const NEEDS_OUTCOME = ['experiment', 'iteration'];
            const errors = [];

            const raw = (pr.body || '').replace(/\r\n/g, '\n').trim();
            const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);

            if (!match) {
              core.setFailed('The description must start with a front matter between ---.');
              return;
            }

            const lines = match[1]
              .split('\n')
              .filter(l => !/^\s*#/.test(l))
              .map(l => l.replace(/\s+#.*$/, ''))
              .filter(l => l.trim() !== '');
            const body = match[2];

            function get(key) {
              const line = lines.find(l => l.startsWith(`${key}:`));
              if (!line) return '';
              return line.slice(key.length + 1).trim().replace(/^"(.*)"$/, '$1');
            }

            const title = get('title');
            const type = get('type');
            const outcome = get('outcome');
            const date = get('date');

            if (!title) errors.push('Falta title.');
            if (!TYPES.includes(type)) {
              errors.push(`invalid or missing type: "${type}". Values: ${TYPES.join(', ')}.`);
            }
            if (NEEDS_OUTCOME.includes(type) && !OUTCOMES.includes(outcome)) {
              errors.push(`outcome is required for "${type}". Values: ${OUTCOMES.join(', ')}.`);
            }
            if (outcome && !OUTCOMES.includes(outcome)) {
              errors.push(`invalid outcome: "${outcome}".`);
            }
            if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
              errors.push(`invalid date: "${date}". Format YYYY-MM-DD.`);
            }
            if (lines.some(l => /^\s*(value|before):\s*$/.test(l))) {
              errors.push('Some metric values are not filled in (value or before).');
            }
            if (/<[a-z]+>/i.test(raw)) {
              errors.push('There are placeholders like <study> left in the description.');
            }
            if (body.trim() === '') {
              errors.push('The content after the front matter is empty.');
            }

            if (errors.length) {
              core.setFailed(`Invalid front matter:\n- ${errors.join('\n- ')}`);
            } else {
              core.info('Valid front matter.');
            }
