# Builds the common environment and checks the pipeline without match data (docs/DOCKER.md):
# the public evaluation reproduces the baselines, an invalid CSV fails with 2, and one worse than
# baseline_smooth50 fails with 5 only if the explicit check is requested.
# The baseline with real data only runs locally.
name: Docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Construir la imagen
        run: docker compose build

      - name: The image carries no code or data
        run: docker run --rm --entrypoint sh gtt-mtah:local -c 'test -z "$(ls -A /app)"'

      - name: Evaluate the public CSVs
        run: docker compose run --rm --user "$(id -u):$(id -g)" evaluar

      - name: P0 tests (contract, public references, generation and errors)
        run: >
          docker compose run --rm --user "$(id -u):$(id -g)"
          --entrypoint python evaluar -m unittest discover -s tests -v

      - name: Held-out harness tests (issue #47, synthetic only, no DFL download)
        run: >
          docker compose run --rm --user "$(id -u):$(id -g)"
          --entrypoint python evaluar -m unittest heldout.tests -v

      - name: An invalid CSV exits with code 2
        run: |
          mkdir -p salidas/invalido
          printf 'frame,label\n0,H\n' > salidas/invalido/corto.csv
          set +e
          docker compose run --rm --user "$(id -u):$(id -g)" evaluar evaluar --resultados /salidas/invalido
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

      - name: A valid CSV below smooth50 exits with code 5
        run: |
          mkdir -p salidas/peor
          cp evaluation/results/baseline_raw.csv salidas/peor/candidato.csv
          set +e
          docker compose run --rm --user "$(id -u):$(id -g)" evaluar evaluar --resultados /salidas/peor --exigir-referencia
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 5

      - name: Comparison with baseline_smooth50
        if: always()
        run: cat salidas/*-evaluar/comparacion.md >> "$GITHUB_STEP_SUMMARY" || true
