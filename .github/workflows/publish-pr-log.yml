
name: Publish merged PR to website log

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  publish-log:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: GTT-TalentArena/gtt-talentarena.github.io
          ref: main
          path: website
          token: ${{ secrets.LOG_REPO_TOKEN }}

      - name: Generate Markdown log
        uses: actions/github-script@v7
        env:
          WEBSITE_DIR: website
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const pr = context.payload.pull_request;
            const date = new Date(pr.merged_at)
              .toISOString().slice(0, 10);

            function yamlQuote(value) {
              return JSON.stringify(String(value ?? ''));
            }

            function slugify(value) {
              return value
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 70) || 'change';
            }

            const author = pr.user.login;
            const title = pr.title;
            const body = (pr.body || '').trim();

            const summaryText = body
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
              .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
              .replace(/[#>*_`~-]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();

            const summary = (
              summaryText ||
              `Changes included in pull request #${pr.number}.`
            ).slice(0, 200);

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const fileList = files.length
              ? files.map(file =>
                  `- \`${file.filename}\` (${file.status}; +${file.additions} / -${file.deletions})`
                ).join('\n')
              : '- No files found.';

            const content = [
              '---',
              `title: ${yamlQuote(title)}`,
              `date: ${date}`,
              'type: change',
              `authors: [${author}]`,
              `summary: ${yamlQuote(summary)}`,
              'tags: [development, pull-request]',
              '---',
              '',
              '## Context',
              '',
              `Automatically generated from [PR #${pr.number}](${pr.html_url}).`,
              '',
              '## Description',
              '',
              body || 'No description was provided in the pull request.',
              '',
              '## Files changed',
              '',
              fileList,
              '',
              '## Pull request',
              '',
              `[View pull request #${pr.number}](${pr.html_url})`,
              ''
            ].join('\n');

            const directory = path.join(
              process.env.WEBSITE_DIR, 'content', 'log'
            );

            fs.mkdirSync(directory, { recursive: true });

            const filename =
              `${date}-${slugify(title)}-pr-${pr.number}.md`;

            const output = path.join(directory, filename);

            if (fs.existsSync(output)) {
              core.info(`Log already exists: ${filename}`);
              return;
            }

            fs.writeFileSync(output, content, 'utf8');
            core.info(`Generated ${output}`);

      - name: Commit and push log
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e

          git -C website config user.name "github-actions[bot]"
          git -C website config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C website add content/log/

          if git -C website diff --cached --quiet; then
            echo "No new changes to publish."
            exit 0
          fi

          git -C website commit -m \
            "docs(log): add entry for PR #${PR_NUMBER}"

          git -C website push origin HEAD:main
