# Entorno común de GTT (guía: docs/DOCKER.md)
#
#   docker compose build
#   docker compose run --rm evaluar                      # CSV públicos, sin datos del partido
#   DATOS=/ruta/a/los/datos docker compose run --rm baseline baseline --repetir
#
# El repo se monta en solo lectura (el código no está en la imagen), los datos en solo lectura y
# todo lo que se genera va a ./salidas, con tu usuario (GTT_UID/GTT_GID, 1000 por defecto).

x-comun: &comun
  build: .
  image: gtt-mtah:local
  user: "${GTT_UID:-1000}:${GTT_GID:-1000}"
  environment:
    GTT_SALIDAS: /salidas
  volumes:
    - .:/app:ro
    - ./salidas:/salidas

services:
  evaluar:
    <<: *comun
    command: ["evaluar"]

  baseline:
    <<: *comun
    environment:
      GTT_SALIDAS: /salidas
      # games.py busca aquí los datos; fuera del contenedor, por defecto en ./data
      MTAH_DATA_DIR: /datos
    volumes:
      - .:/app:ro
      - ./salidas:/salidas
      # Carpeta con tactical/ (y broadcast/ si se usa). Sin DATOS, se usa ./data del repo
      - ${DATOS:-./data}:/datos:ro
    command: ["baseline"]

  modelo:
    <<: *comun
    environment:
      GTT_SALIDAS: /salidas
      MTAH_DATA_DIR: /datos
    volumes:
      - .:/app:ro
      - ./salidas:/salidas
      - ${DATOS:-./data}:/datos:ro
    command: ["modelo", "--config", "configs/baseline_smooth50.json"]
