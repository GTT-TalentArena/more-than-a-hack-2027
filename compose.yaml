# GTT common environment (guide: docs/DOCKER.md)
#
#   docker compose build
#   docker compose run --rm evaluar                      # public CSVs, no match data
#   DATOS=/ruta/a/los/datos docker compose run --rm baseline baseline --repetir
#
# The repo is mounted read-only (the code is not in the image), the data read-only, and
# everything generated goes to ./salidas, owned by your user (GTT_UID/GTT_GID, 1000 by default).

x-comun: &comun
  build: .
  image: gtt-mtah:local
  user: "${GTT_UID:-1000}:${GTT_GID:-1000}"
  environment:
    GTT_SALIDAS: /salidas
  volumes:
    - .:/app:ro
    - ./salidas:/salidas

services:
  evaluar:
    <<: *comun
    command: ["evaluar"]

  baseline:
    <<: *comun
    environment:
      GTT_SALIDAS: /salidas
      # games.py looks for the data here; outside the container, ./data by default
      MTAH_DATA_DIR: /datos
    volumes:
      - .:/app:ro
      - ./salidas:/salidas
      # Folder with tactical/ (and broadcast/ if used). Without DATOS, the repo's ./data is used
      - ${DATOS:-./data}:/datos:ro
    command: ["baseline"]

  modelo:
    <<: *comun
    environment:
      GTT_SALIDAS: /salidas
      MTAH_DATA_DIR: /datos
    volumes:
      - .:/app:ro
      - ./salidas:/salidas
      - ${DATOS:-./data}:/datos:ro
    command: ["modelo", "--config", "configs/baseline_smooth50.json"]
